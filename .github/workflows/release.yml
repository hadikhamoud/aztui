name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build on native architecture only - cross-compilation doesn't work
          # with packages that have platform-specific dynamic imports
          - os: ubuntu-latest
            artifact: aztui-linux-x64
          - os: ubuntu-24.04-arm64
            artifact: aztui-linux-arm64
          - os: macos-13
            artifact: aztui-darwin-x64
          - os: macos-latest
            artifact: aztui-darwin-arm64
          - os: windows-latest
            artifact: aztui-windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build executable
        run: bun build ./index.tsx --compile --outfile ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          # Move and rename artifacts
          mv artifacts/aztui-linux-x64/aztui-linux-x64 release/
          mv artifacts/aztui-linux-arm64/aztui-linux-arm64 release/
          mv artifacts/aztui-darwin-x64/aztui-darwin-x64 release/
          mv artifacts/aztui-darwin-arm64/aztui-darwin-arm64 release/
          mv artifacts/aztui-windows-x64.exe/aztui-windows-x64.exe release/
          # Make binaries executable
          chmod +x release/aztui-*
          # Create checksums
          cd release && sha256sum * > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/aztui-linux-x64
            release/aztui-linux-arm64
            release/aztui-darwin-x64
            release/aztui-darwin-arm64
            release/aztui-windows-x64.exe
            release/checksums.txt
          generate_release_notes: true
